<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Monitoramento - Patos-PB</title>
    <style>
        body { 
            background-color: #0b132b; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 15px; 
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 { 
            font-size: 1.1rem; 
            color: #fff; 
            margin: 0;
            line-height: 1.3;
        }
        .status-online {
            background-color: #064e3b;
            color: #34d399;
            border: 1px solid #059669;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
        }
        .section-title {
            color: #ff6b6b;
            font-size: 0.95rem;
            font-weight: bold;
            margin: 15px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card { 
            background: #1c2541; 
            border: 1px solid #3a506b; 
            border-radius: 10px; 
            padding: 15px; 
            margin-bottom: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card.sos { 
            border-left: 5px solid #ff4d4d; 
            background: linear-gradient(135deg, #2a1b2e 0%, #1c2541 100%);
        }
        .badge { 
            background: #ff4d4d; 
            color: white; 
            padding: 3px 8px; 
            border-radius: 4px; 
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
        }
        .card p {
            margin: 6px 0;
            font-size: 0.9rem;
        }
        .time {
            float: right;
            font-size: 0.75rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>CENTRAL DE<br>MONITORAMENTO – PATOS-PB</h1>
        <div class="status-online">
            <div class="status-dot"></div>
            Sistema Online
        </div>
    </div>

    <div class="section-title">🚨 SOS Pânico Ativos</div>
    <div id="lista-alertas">A carregar ocorrências...</div>

    <script>
        const SUPABASE_URL = 'https://urgtiuscnoboawqndcqt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZ3RpdXNjbm9ib2F3cW5kY3F0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMTc4NDIsImV4cCI6MjEwNjY5Mzg0Mn0.IwbOIXJsdpgQl26_FWniiuKmEaL-ZrX-8K61B-jljWg';

        async function buscarOcorrencias() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/ocorrencias?select=*&order=id.desc&limit=10`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (res.ok) {
                    const dados = await res.json();
                    const container = document.getElementById('lista-alertas');
                    if (dados.length === 0) {
                        container.innerHTML = '<p style="color: #a0aec0; font-size: 0.9rem;">Nenhum alerta de pânico ativo.</p>';
                        return;
                    }
                    let html = '';
                    dados.forEach(item => {
                        html += `
                            <div class="card sos">
                                <span class="badge">ALERTA SOS</span>
                                <span class="time">ID: ${item.id}</span>
                                <p><b>Local:</b> ${item.bairro || 'Centro, Patos-PB'}</p>
                                <p><b>Coords:</b> ${item.latitude || ''}, ${item.longitude || ''}</p>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                }
            } catch (e) {
                console.error('Erro ao buscar dados:', e);
            }
        }

        setInterval(buscarOcorrencias, 2000);
        buscarOcorrencias();
    </script>
</body>
</html>
